<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="estilos/stylesheet.css">

</head>
<body>
    <main>
       
        <div id="fundo">
            <img src="imagens/imagem.jpg" alt="Imagem do lado de login">
        </div>

        <section id="Login" >
              
              <div id="formulario" >
                 <h1>Login</h1>
                 <p>Seja Bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                 <form action="login.php" method="post">
                    <div  id="pf-iemail">
                        <p>
                            <label for="iemail"> <img src="imagens/person.png" alt="imagem pessoa email"> </label>
                            <input type="email" name="email" id="iemail">
                        </p>
                    </div>

                    <div id="pf-isen" >
                        <p>
                            <label for="isen"> <img id="teste" src="imagens/key.png" alt="Chave da senha"> </label>
                            <input type="password" name="sen" id="isen">
                        </p>
                    </div>

                    <p>
                        <input type="submit" value="Enviar">

                        <input id="botao" type="button" value="Esqueci a senha" >
                    </p>
                 </form>
              </div>
        </section>
    </main>
</body>
</html>
