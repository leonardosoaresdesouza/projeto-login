<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="estilos/stylesheet.css">

</head>
<body>
    <main>
       
        <div id="fundo">
            <img src="imagens/imagem.jpg" alt="Imagem do lado de login">
        </div>

        <section id="Login" >
              
              <div id="formulario" >
                 <h1>Login</h1>
                
                 <p class="text">Seja Bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                 
                 <form action="login.php" method="post">
                   
                    <div  id="pf-iemail">
                        <p class="pf-campo">
                            <label for="iemail">
            
                                <div class="foto"> 
                                    <img src="imagens/person.png" alt="imagem pessoa email">
                                </div> 

                            </label>

                              <input class="iinput" type="email" name="email" id="iemail" placeholder="seu e-mail" >

                            </p>
                     </div>

                    <div id="pf-isen" >
                        <p>
                            <label for="isen"> 
                                
                                <div class="foto">
                                    <img id="teste" src="imagens/key.png" alt="Chave da senha">
                                </div>

                            </label>
                        
                             <input class="iinput" type="password" name="sen" id="isen" placeholder="sua senha" >
                            
                        </p>
                    </div>

                    <p>
                        <input type="submit" value="Enviar">

                        <input id="botao" type="button" value="Esqueci a senha" >
                    </p>
                 </form>
              </div>
        </section>
    </main>
</body>
</html>
